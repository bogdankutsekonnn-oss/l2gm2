name: Sync prices from GiranInfo

# Цены рынка Lu4 (сервер Gamma) с giran.info → таблица resources в админке
# (см. scripts/sync-giran-prices.js). GiranInfo делает срез около 6:00 МСК.

on:
  schedule:
    # 6:10 и 18:10 по Москве (03:10 и 15:10 UTC). Минута не круглая: в начале
    # часа GitHub режет расписания первым делом, да и срез к 6:10 уже готов.
    - cron: '10 3,15 * * *'
  workflow_dispatch:

concurrency:
  group: sync-giran-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Забор цен с GiranInfo
        env:
          GIRAN_COOKIE: ${{ secrets.GIRAN_COOKIE }}
          GIRAN_SERVER: Gamma
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ZAYAVKI_BOT_TOKEN: ${{ secrets.ZAYAVKI_BOT_TOKEN }}
        run: node scripts/sync-giran-prices.js
