name: Deploy to Timeweb

on:
  push:
    branches: [main]
  # Позволяет запускать деплой вручную и из sync-servers.yml после мёржа из базы
  # (пуш токеном GITHUB_TOKEN сам по себе деплой не триггерит).
  workflow_dispatch:
  schedule:
    # Ежедневный ребилд в 03:40 UTC (06:40 МСК): категории дат («Сегодня»,
    # «Завтра») и 30-дневное окно серверов запекаются в статику на момент
    # билда — без регулярного ребилда главная отдаёт поисковикам устаревшие даты.
    - cron: '40 3 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate backend secrets from GitHub Secrets
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ZAYAVKI_BOT_TOKEN: ${{ secrets.ZAYAVKI_BOT_TOKEN }}
          COMMENTS_BOT_TOKEN: ${{ secrets.COMMENTS_BOT_TOKEN }}
          COMMENTS_ADMIN_KEY: ${{ secrets.COMMENTS_ADMIN_KEY }}
          GH_WORKFLOW_PAT: ${{ secrets.GH_WORKFLOW_PAT }}
        run: |
          # Секреты для public/api/ (админка + бот заявок + кнопка синка)
          cat > public/api/secrets.php <<PHP
          <?php
          define('DB_PASS', '${DB_PASS}');
          define('ADMIN_TOKEN', '${ADMIN_TOKEN}');
          define('TG_BOT_TOKEN', '${ZAYAVKI_BOT_TOKEN}');
          define('GH_WORKFLOW_PAT', '${GH_WORKFLOW_PAT}');
          PHP

          # Конфиг для public/comments-api/ (комментарии)
          cat > public/comments-api/config.php <<PHP
          <?php
          return [
              'db_host' => 'localhost',
              'db_name' => 'damonlaptev_servers',
              'db_user' => 'damonlaptev_servers',
              'db_pass' => '${DB_PASS}',
              'bot_token' => '${COMMENTS_BOT_TOKEN}',
              'bot_username' => 'l2gm_comment_bot',
              'channel' => '@l2gm_official',
              'admin_key' => '${COMMENTS_ADMIN_KEY}',
              'allow_origin' => 'https://l2gm.com',
          ];
          PHP

      - run: npx nuxt generate

      - name: Проверка сборки на запечённые 404
        run: |
          # Страховка поверх prerender.failOnError: страница может отрендерить
          # error.vue без падения пререндера и уехать на прод с кодом 200 и
          # заголовком «Страница не найдена» (так 13 страниц попали в индекс
          # Яндекса 12-13.08.2026). Сам 404.html — легитимный, его исключаем.
          hits=$(grep -rlF 'Страница не найдена | L2GM' .output/public --include='*.html' \
            | grep -vE '/(404|200)\.html$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Сборка содержит 404-страницы вместо контента — деплой остановлен:"
            echo "$hits"
            exit 1
          fi
          echo "OK: запечённых 404 в сборке нет"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: /public_html/

      - name: Смоук-тест живого сайта
        run: |
          # Гейт выше проверяет сборку, но не то, что реально легло на хостинг:
          # FTP заливает файлы поштучно, и оборванная заливка оставляет часть
          # страниц битыми, а workflow при этом отчитается об успехе. Проверяем
          # выдачу по всем адресам из sitemap — список динамический, новые
          # статьи попадают в проверку сами.
          sleep 20
          UA='Mozilla/5.0 (compatible; l2gm-deploy-check)'
          urls=$(curl -s --max-time 30 -A "$UA" https://l2gm.com/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          count=$(printf '%s\n' "$urls" | grep -c . || true)
          if [ "$count" -lt 50 ]; then
            echo "::error::sitemap.xml отдал $count адресов — сайт после деплоя недоступен или карта битая"
            exit 1
          fi
          fails=''
          for u in $urls; do
            # Две попытки: одиночный сетевой сбой не должен красить деплой
            for attempt in 1 2; do
              resp=$(curl -s -L --max-time 25 -A "$UA" -w '\n%{http_code}' "$u" || true)
              code=$(printf '%s' "$resp" | tail -n1)
              title=$(printf '%s' "$resp" | grep -o '<title>[^<]*</title>' | head -1 | sed 's/<[^>]*>//g')
              if [ "$code" = "200" ] && [ -n "$title" ]; then break; fi
            done
            if [ "$code" != "200" ]; then
              fails="$fails\n  HTTP $code — $u"
            elif [ -z "$title" ]; then
              fails="$fails\n  без title — $u"
            else
              case "$title" in
                *'Страница не найдена'*) fails="$fails\n  404-заголовок — $u" ;;
              esac
            fi
          done
          if [ -n "$fails" ]; then
            echo "::error::Живой сайт отдаёт битые страницы:"
            printf '%b\n' "$fails"
            exit 1
          fi
          echo "OK: проверено $count адресов, все отдают 200 и свой title"
