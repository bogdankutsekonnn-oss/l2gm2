name: Deploy to Timeweb

on:
  push:
    branches: [main]
  # Позволяет запускать деплой вручную и из sync-servers.yml после мёржа из базы
  # (пуш токеном GITHUB_TOKEN сам по себе деплой не триггерит).
  workflow_dispatch:
  schedule:
    # Ежедневный ребилд в 03:40 UTC (06:40 МСК): категории дат («Сегодня»,
    # «Завтра») и 30-дневное окно серверов запекаются в статику на момент
    # билда — без регулярного ребилда главная отдаёт поисковикам устаревшие даты.
    - cron: '40 3 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate backend secrets from GitHub Secrets
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ZAYAVKI_BOT_TOKEN: ${{ secrets.ZAYAVKI_BOT_TOKEN }}
          COMMENTS_BOT_TOKEN: ${{ secrets.COMMENTS_BOT_TOKEN }}
          COMMENTS_ADMIN_KEY: ${{ secrets.COMMENTS_ADMIN_KEY }}
          GH_WORKFLOW_PAT: ${{ secrets.GH_WORKFLOW_PAT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          # Секреты для public/api/ (админка + бот заявок + кнопка синка)
          cat > public/api/secrets.php <<PHP
          <?php
          define('DB_PASS', '${DB_PASS}');
          define('ADMIN_TOKEN', '${ADMIN_TOKEN}');
          define('TG_BOT_TOKEN', '${ZAYAVKI_BOT_TOKEN}');
          define('GH_WORKFLOW_PAT', '${GH_WORKFLOW_PAT}');
          PHP

          # Конфиг для public/comments-api/ (комментарии)
          cat > public/comments-api/config.php <<PHP
          <?php
          return [
              'db_host' => 'localhost',
              'db_name' => 'damonlaptev_servers',
              'db_user' => 'damonlaptev_servers',
              'db_pass' => '${DB_PASS}',
              'bot_token' => '${COMMENTS_BOT_TOKEN}',
              'bot_username' => 'l2gm_comment_bot',
              'channel' => '@l2gm_official',
              'admin_key' => '${COMMENTS_ADMIN_KEY}',
              'allow_origin' => 'https://l2gm.com',
          ];
          PHP

          # Конфиг для public/auth-api/ (Google / Яндекс / Email / Telegram)
          cat > public/auth-api/config.php <<PHP
          <?php
          return [
              'db_host' => 'localhost',
              'db_name' => 'damonlaptev_servers',
              'db_user' => 'damonlaptev_servers',
              'db_pass' => '${DB_PASS}',
              'google_client_id' => '${GOOGLE_CLIENT_ID}',
              'google_client_secret' => '${GOOGLE_CLIENT_SECRET}',
              'yandex_client_id' => '${YANDEX_CLIENT_ID}',
              'yandex_client_secret' => '${YANDEX_CLIENT_SECRET}',
              'smtp_host' => '${SMTP_HOST}',
              'smtp_port' => 465,
              'smtp_user' => '${SMTP_USER}',
              'smtp_pass' => '${SMTP_PASS}',
              'smtp_from' => '${SMTP_FROM}',
              'smtp_from_name' => 'L2GM',
              'redirect_base' => 'https://l2gm.com',
              'allow_origin' => 'https://l2gm.com',
              'telegram_bot_token' => '${COMMENTS_BOT_TOKEN}',
              'telegram_channel' => '@l2gm_official',
          ];
          PHP

      - run: npx nuxt generate

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: /public_html/
